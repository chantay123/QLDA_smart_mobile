<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bill Detail</title>
    <link th:fragment="custom-css" rel="stylesheet" th:href="@{/css/HomepageStyle.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>
<th:block th:replace="~{home/layout::header}"></th:block>

<div class="container mb-5 mt-3">
    <div class="row d-flex align-items-baseline">
        <div class="col-xl-9">
            <p style="color: #7e8d9f;font-size: 20px;">Invoice >> <strong>ID: #<span th:text="${order.id}"></span></strong></p>
        </div>
        <div class="col-xl-3 text-end">
            <button class="btn btn-light text-capitalize border-0" onclick="window.print()">
                <i class="fas fa-print text-primary"></i> Print
            </button>
        </div>
        <hr>
    </div>

    <div class="row">
        <div class="col-xl-8">
            <ul class="list-unstyled">
                <li class="text-muted">To: <span th:text="${user.username}"></span></li>
                <li class="text-muted"><span th:text="${order.address}"></span></li>
                <li class="text-muted"><i class="fas fa-phone"></i> <span th:text="${user.phoneNumber}"></span></li>
            </ul>
        </div>
        <div class="col-xl-4">
            <p class="text-muted">Invoice</p>
            <ul class="list-unstyled">
                <li class="text-muted"><i class="fas fa-circle"></i> <span class="fw-bold">ID:</span> <span th:text="${order.id}"></span></li>
                <li class="text-muted"><i class="fas fa-circle"></i> <span class="fw-bold">Creation Date:</span> <span th:text="${order.orderDate}"></span></li>
                <li class="text-muted"><i class="fas fa-circle"></i> <span class="fw-bold">Status:</span>
                    <span th:text="${order.status}"
                          th:classappend="${order.status == 'Paid'} ? 'badge bg-success' : 'badge bg-warning text-black fw-bold'"></span>
                </li>
            </ul>
        </div>
    </div>

    <div class="row my-2 mx-1 justify-content-center">
        <table class="table table-striped table-borderless">
            <thead style="background-color:#84B0CA;" class="text-white">
            <tr>
                <th scope="col">#</th>
                <th scope="col">Description</th>
                <th scope="col">Qty</th>
                <th scope="col">Unit Price</th>
                <th scope="col">Amount</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, iterStat : ${orderItems}">
                <th scope="row" th:text="${iterStat.count}"></th>
                <td th:text="${item.product.name}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${item.price}"></td>
                <td th:text="${item.price * item.quantity}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="row">
        <div class="col-xl-8">
            <p class="ms-3">Add additional notes and payment information</p>
        </div>
        <div class="col-xl-3">
            <ul class="list-unstyled">
                <li class="text-muted ms-3"><span class="text-black me-4">SubTotal</span><span th:text="${order.total}"></span> VND</li>
            </ul>
            <p class="text-black float-start"><span class="text-black me-3">Total Amount</span><span style="font-size: 25px;" th:text="${order.total}"></span> VND</p>
        </div>
    </div>

    <hr>
    <div class="row">
        <div class="col-xl-10">
            <p>Thank you for your purchase</p>
            <span th:if="${order.status == 'Paid'}" class="badge bg-success text-white">Already Paid</span>
        </div>
        <div class="col-xl-2">
            <form th:if="${order.status != 'Paid'}"  th:action="@{/process-payment}" method="post">
                <input type="hidden" name="id" th:value="${order.id}" />
                <button type="submit" class="btn btn-primary text-capitalize">Pay Now</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<th:block th:replace="~{home/layout::footer}"></th:block>
</body>
</html>
