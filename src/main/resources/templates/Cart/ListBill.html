<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Bill</title>
    <link th:fragment="custom-css" rel="stylesheet"
          th:href="@{/css/HomepageStyle.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>
<th:block th:replace="~{home/layout::header}"></th:block>
<section style="background-color: #eee;">
    <div class="container py-5">
        <div class="row justify-content-center mb-3">
            <div class="col-md-12 col-xl-10">
                <div class="card shadow-0 border rounded-3">
                    <div class="card-body">
                        Danh Sách Hóa Đơn
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-12 col-xl-10">
                <div th:if="${orders.isEmpty()}" class="alert alert-warning text-center" role="alert">
                    Bạn chưa có hóa đơn nào.
                </div>
                <div th:if="${!orders.isEmpty()}" th:each="order : ${orders}" class="card shadow-0 border rounded-3 mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-12 col-lg-3 col-xl-3 mb-4 mb-lg-0">
                                <div style="align-items: center;justify-content: center;display: flex;height: 10vh;font-size: 30px;">Order: <span th:text="${order.id}"></span></div>
                            </div>
                            <div class="col-md-6 col-lg-6 col-xl-6">
                                <h5>Order Date: <span th:text="${#dates.format(order.orderDate, 'yyyy-MM-dd')}"></span></h5>
                                <h5>Address: <span th:text="${order.address}"></span></h5>
                                <span class="me-1 fw-bold">Status:</span>
                                <span th:text="${order.status}"
                                      th:classappend="${order.status == 'Paid'} ? 'badge bg-success' : 'badge bg-warning text-black fw-bold'"></span>
                            </div>
                            <div class="col-md-6 col-lg-3 col-xl-3 border-sm-start-none border-start">
                                <div class="d-flex flex-row align-items-center mb-1">
                                    <h4 class="mb-1 me-1">Total: <span th:text="${order.total}"></span> VND</h4>
                                </div>
                                <div class="d-flex flex-column mt-4">
                                    <a th:href="@{'/bill/your-bills/' + ${order.id}}" class="btn btn-primary btn-sm">Details</a>
<!--                                    <form th:if="${order.status != 'Paid'}" th:action="@{/bill/pay}" method="post">-->
<!--                                        <input type="hidden" name="orderId" th:value="${order.id}" />-->
<!--                                        <button type="submit" class="btn btn-outline-primary btn-sm mt-2">Pay Now</button>-->
<!--                                    </form>-->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<th:block th:replace="~{home/layout::footer}"></th:block>
</body>
</html>
