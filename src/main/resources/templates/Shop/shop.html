<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <title>Shop</title>
    <th:block th:replace="~{home/layout::custom-css}"></th:block>
    <link rel="stylesheet" th:href="@{/css/shop.css}">
    <link href="https://cdn.prod.website-files.com/65f0219f664a58453bb579a5/css/ecommerce-tnc.webflow.292f7f861.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,300italic,400,400italic,600,600italic,700,700italic,800,800italic%7CMaterial+Icons:regular%7CMaterial+Icons+Outlined:regular%7CJost:300,regular,500,600,700,800" media="all">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>
<th:block th:replace="~{home/layout::header}"></th:block>
<div class="page-wrapper">
    <section class="section">
        <div class="container _2-column-container">
            <div data-w-id="cc6e4718-ba15-402c-9595-d69fba7a0cda" class="hide-filter-bar">
                <div class="icon">filter_alt_off</div>
                <div>Hide Filter</div>
            </div>
            <div class="sidebar-form">
                <div class="sidebar-wrapper">
                    <form action="/shop" method="GET" class="search w-form">
                        <div class="w-layout-vflex _10px-gap">
                            <div class="_20px-bold-title">Lọc theo thương hiệu</div>
                            <div class="full-width">
                                <div class="widget">
                                    <div class="checkbox-field">
                                        <input type="checkbox" id="allBrands" name="allBrands" value="all" onchange="toggleAllBrands(this)">
                                        <div class="paragraph-300">All</div>
                                    </div>
                                    <div class="w-dyn-list">
                                        <div role="list" class="product-categories w-dyn-items">
                                            <div role="listitem" class="w-dyn-item" th:each="brand : ${brands}">
                                                <div class="checkbox-field">
                                                    <input type="checkbox" class="brandCheckbox" name="brands" th:value="${brand.id}">
                                                    <div class="paragraph-300" th:text="${brand.name}"></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="w-layout-vflex _10px-gap">
                            <div class="_20px-bold-title">Lọc theo giá</div>
                            <div class="full-width w-dyn-list">
                                <!-- Mục All cho lọc giá -->
                                <div class="checkbox-field">
                                    <input type="checkbox" id="allPrices" name="allPrices" value="all" onchange="toggleAllPrices(this)">
                                    <div class="paragraph-300">All</div>
                                </div>
                                <div role="list" class="widget w-dyn-items">
                                    <div role="listitem" class="w-dyn-item">
                                        <div class="checkbox-field">
                                            <input type="checkbox" class="priceCheckbox" name="priceRange" value="1000000-3000000">
                                            <div class="paragraph-300">1.000.000 - 3.000.000</div>
                                        </div>
                                    </div>
                                    <div role="listitem" class="w-dyn-item">
                                        <div class="checkbox-field">
                                            <input type="checkbox" class="priceCheckbox" name="priceRange" value="3000000-7000000">
                                            <div class="paragraph-300">3.000.000 - 7.000.000</div>
                                        </div>
                                    </div>
                                    <div role="listitem" class="w-dyn-item">
                                        <div class="checkbox-field">
                                            <input type="checkbox" class="priceCheckbox" name="priceRange" value="7000000-">
                                            <div class="paragraph-300">Trên 7.000.000</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="button">Lọc sản phẩm</button>
                    </form>
                </div>
            </div>

            <div class="main-block">
                <div class="product-archive-tab-wrapper">
                    <div data-current="Tab 1" data-easing="ease-out-quart" data-duration-in="500"
                         data-duration-out="400" class="w-tabs">
                        <div class="w-tab-content">
                            <div data-w-tab="Tab 1" class="w-tab-pane w--tab-active" id="w-tabs-0-data-w-pane-0"
                                 role="tabpanel" aria-labelledby="w-tabs-0-data-w-tab-0">
                                <div class="row full-width w-dyn-list" >

                                    <div role="list" class="col-4 w-dyn-items mb-4" th:each="product: ${products}">
                                        <div role="listitem" class="center-align w-dyn-item">
                                            <div class="product-card">
                                                <a href="/product/tnc-gaming-keyboard" class="product-thumbnail-wrapper w-inline-block">
                                                    <img
                                                            th:src="${product.imageUrl}"
                                                            th:alt="${product.name}"
                                                            sizes="(max-width: 991px) 252px, 16vw"
                                                            class="product-thumbnail-archive">
                                                </a>
                                                <div class="w-layout-vflex product-body">
                                                    <a th:href="@{/shop/product/{id}(id=${product.id})}" class="mask w-inline-block">
                                                        <div class="product-name" th:text="${product.name}"></div>
                                                    </a>
                                                    <div class="w-layout-hflex star-wrapper">
                                                        <div class="star">star</div>
                                                        <div class="star">star</div>
                                                        <div class="star">star</div>
                                                        <div class="star">star</div>
                                                        <div class="star">star</div>
                                                    </div>
                                                    <div class="w-layout-hflex product-price-block">
                                                        <div class="product-price-block">
                                                            <div class="card-price" th:text="${#numbers.formatCurrency(product.price)}"></div>
                                                            <div class="_2px-with-divider"></div>
                                                            <div class="card-compare-prices" th:text="${#numbers.formatCurrency(product.price + product.price * 90 / 100)}"></div>
                                                        </div>
                                                    </div>
                                                    <div class="add-to-cart">
                                                        <form sec:authorize="isAuthenticated()" th:action="@{/cart/add}" method="post">
                                                            <input type="hidden" name="productId" th:value="${product.id}" />
                                                            <button type="submit" class="btn btn-outline-primary">Thêm Vào Giỏ</button>
                                                        </form>
                                                    </div>
                                                </div>
                                                <div class="sale-tag">On Sale</div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </section>
</div>
<th:block th:replace="~{home/layout::footer}"></th:block>
<script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=65f0219f664a58453bb579a5"
        type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
<script src="https://cdn.prod.website-files.com/65f0219f664a58453bb579a5/js/webflow.3b4ad4433.js" type="text/javascript"></script>

<script>
    function toggleAllBrands(allCheckbox) {
        const brandCheckboxes = document.querySelectorAll('.brandCheckbox');
        brandCheckboxes.forEach(checkbox => {
            checkbox.checked = allCheckbox.checked;
        });
    }

    function toggleAllPrices(allCheckbox) {
        const priceCheckboxes = document.querySelectorAll('.priceCheckbox');
        priceCheckboxes.forEach(checkbox => {
            checkbox.checked = allCheckbox.checked;
        });
    }
</script>
</body>
</html>
