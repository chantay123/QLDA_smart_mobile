<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail</title>
    <th:block th:replace="~{home/layout::custom-css}"></th:block>
    <link rel="stylesheet" th:href="@{/css/productDetail.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>

<body>
<th:block th:replace="~{home/layout::header}"></th:block>
<section class="section">
    <div class="container _2-column-container">
        <div class="product-images-wrapper ">
            <a href="" class="product-image-background">
                <img class="product-image "
                     th:src="${product.imageUrl}"
                     th:alt="${product.name}">
            </a>
        </div>
        <div class="product-details-block">
            <h1 class="product-title" th:text="${product.name}">
            </h1>
            <div style="color: #fdbf60;">
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
            </div>
            <div class="price-wrapper">
                <div class="single-product-price " th:text="${#numbers.formatCurrency(product.price)}">
                </div>
                <div class="_1px-width-divider hide-in-mobile"></div>
                <div class="single-product-price compare-price" th:text="${#numbers.formatCurrency(product.price + product.price * 90 / 100)}"></div>
            </div>
            <p th:text="${product.description}"></p>
            <div class="cart-border-wrapper">
                <form data-node-type="commerce-add-to-cart-form" data-commerce-sku-id="65f417d25648396c93eba144"
                      data-loading-text="Adding to cart..." data-commerce-product-id="65f417d175110061b90fb05c"
                      class="w-commerce-commerceaddtocartform cart-button-wrapper"><label
                        class="hidden"></label><input type="number" min="1"
                                                      class="w-commerce-commerceaddtocartquantityinput product-quantity" value="1"><input
                        type="submit" class="w-commerce-commerceaddtocartbutton single-page-cart-button"
                        value="Add to Cart"><a style="display:none"
                                               class="w-commerce-commercebuynowbutton w-dyn-hide" href="/checkout">Buy
                    now</a></form>
            </div>
        </div>
    </div>
</section>
<th:block th:replace="~{home/layout::footer}"></th:block>
</body>

</html>
