<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brand Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{Layout/Admin :: layout}"></div>
    <div class="background_bm" th:fragment="content">
<div class="container-fluid" >
        <div class="d-flex justify-content-between align-items-center mb-2 mb-lg-0">
            <button class="btn btn-primary m-2" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#staticBackdrop" aria-controls="staticBackdrop">
                <i class="bi bi-list-ul"></i>
            </button>
            <a href="/admin/brands/add" class="btn btn-success m-2">Add Brand</a>
        </div>
        <div class="body_content container">
            <div class="row">
                <div class="mb-4 mb-lg-0">
                    <div class="card">
                        <h5 class="card-header bg-success-subtle"><i class="bi bi-person-bounding-box"></i>
                            Brand Management</h5>
                        <div class="card-body">
                            <div class="table-responsive text-center">
                                <table class="table table-striped">
                                    <thead>
                                    <tr>
                                        <th scope="col">Numerical order</th>
                                        <th scope="col">Name</th>
                                        <th scope="col">Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="brand : ${brands}">
                                        <td th:text="${brandStat.index + 1}"></td>
                                        <td th:text="${brand.name}"></td>
                                        <td>
                                            <a th:href="@{/admin/brands/edit/{id}(id=${brand.id})}" class="btn btn-warning">Edit</a>
                                            <a th:href="@{/admin/brands/delete/{id}(id=${brand.id})}" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this brand?');">Delete</a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
