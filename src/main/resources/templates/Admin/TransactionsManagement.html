<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction Management</title>
</head>
<body>
<div th:replace="~{Layout/Admin :: layout}">

</div>
    <div class="background_tm" th:fragment="content">
<div class="container-fluid " >
        <div class="d-flex justify-content-between align-items-center mb-2 mb-lg-0">
            <button class="btn btn-primary m-2" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#staticBackdrop" aria-controls="staticBackdrop">
                <i class="bi bi-list-ul"></i>
            </button>
            <div class="date_time">
                <div class="date_start">
                    <input type="text" id="datepicker_start" class="form-control">
                </div>
                <div>
                    <h3><i class="bi bi-arrow-right"></i></h3>
                </div>
                <div class="date_end">
                    <input type="text" id="datepicker_end" class="form-control">
                </div>
                <div>
                    <button class="btn btn-success" type="submit">Accept</button>
                </div>
            </div>
            <form class="d-flex m-3" role="search">
                <input class="form-control me-2 search-input" type="search" placeholder="OrderID, Product Name, or Customer"
                       aria-label="Search">
                <button class="btn btn-warning" type="submit">Search</button>
            </form>
        </div>
        <div class="body_content container">
            <div class="row">
                <div class="mb-4 mb-lg-0">
                    <div class="card">
                        <h5 class="card-header bg-success-subtle"><i class="bi bi-phone"></i> Transactions Management</h5>
                        <div class="card-body">
                            <div class="table-responsive text-center">
                                <table class="table table-striped">
                                    <thead>
                                    <tr>
                                        <th scope="col">OrderID</th>
                                        <th scope="col">Customer</th>
                                        <th scope="col">Quantity product</th>
                                        <th scope="col">Total</th>
                                        <th scope="col">Date</th>
                                        <th scope="col"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="order : ${orders}">
                                        <td th:text="${order.id}">Order ID</td>
                                        <td th:each="user : ${order.user}" th:text="${user.username}">Customer</td>
                                        <td th:text="${#lists.size(order.orderItems)}">Quantity product</td>
                                        <td th:text="${order.total}">Total</td>
                                        <td th:text="${#dates.format(order.orderDate, 'yyyy-MM-dd')}">Date</td>
                                        <td>
                                            <button class="btn btn-info">View</button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
