<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brand Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2 th:text="${brand.id} == null ? 'Add Brand' : 'Edit Brand'"></h2>
    <form th:action="@{${brand.id} == null ? '/admin/brands/add' : '/admin/brands/edit/' + ${brand.id}}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Brand Name</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${brand.name}" required>
        </div>
        <div class="mb-3">
            <label for="imageUrl" class="form-label">Image URL</label>
            <input type="text" class="form-control" id="imageUrl" name="imageUrl" th:value="${brand.imageUrl}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" th:text="${brand.description}"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <a href="/admin/brands" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
