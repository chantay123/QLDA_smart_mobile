<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{Layout/Admin :: layout}"></div>

<!-- Main container -->
<div class="container-fluid" th:fragment="content">
    <!-- Sidebar Toggle Button -->
    <div class="d-flex justify-content-start my-3">
        <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#staticBackdrop" aria-controls="staticBackdrop">
            <i class="bi bi-list-ul"></i> Menu
        </button>
    </div>

    <!-- Dashboard Content -->
    <div class="container">
        <!-- Statistics Row -->
        <div class="row g-4 mb-4">
            <!-- Users Count -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Users</h5>
                    </div>
                    <div class="card-body">
                        <h5 class="display-6" th:text="${numberOfUser}"></h5> <!-- Số lượng người dùng -->
                        <p>Total number of users</p>
                    </div>
                </div>
            </div>
            <!-- Orders Count -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Orders</h5>
                    </div>
                    <div class="card-body">
                        <h5 class="display-6" th:text="${numberOfOrders}"></h5> <!-- Số lượng đơn hàng -->
                        <p>Total number of orders</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Latest Transactions Table -->
        <div class="row">
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">Latest Transactions</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover text-center">
                                <thead class="table-dark">
                                <tr>
                                    <th scope="col">Order ID</th>
                                    <th scope="col">Product</th>
                                    <th scope="col">Customer</th>
                                    <th scope="col">Total</th>
                                    <th scope="col">Date</th>
                                    <th scope="col">Status</th>
                                </tr>
                                </thead>
                                <tbody>
                                <!-- Hiển thị danh sách order từ model -->
                                <tr th:each="order : ${orders}">
                                    <td th:text="${order.id}"></td> <!-- Order ID -->
                                    <td th:text="${#lists.size(order.orderItems)}"></td> <!-- Số lượng sản phẩm trong đơn -->
                                    <td th:text="${order.user.email}"></td> <!-- Email khách hàng -->
                                    <td th:text="${order.total}"></td> <!-- Tổng giá trị đơn hàng -->
                                    <td th:text="${#dates.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"></td> <!-- Ngày đặt hàng -->
                                    <td th:text="${order.status}"></td> <!-- Trạng thái đơn hàng -->
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <a href="/admin/all-bills" class="btn btn-block btn-light">View all</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
